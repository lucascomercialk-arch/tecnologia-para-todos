name: Frontend & API Checks (i18n, Unit, Security & E2E)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  unit-and-i18n:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: npm run check:syntax

      - name: Run i18n regression tests
        run: npm run test:i18n

      - name: Run Vitest unit tests
        run: npm run test:unit

  api-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: tpt-tasks-api/requirements.txt

      - name: Install API dependencies
        run: python -m pip install -r tpt-tasks-api/requirements.txt

      - name: Run Tasks API & Security pytest suite
        run: pytest --rootdir=tpt-tasks-api -v tpt-tasks-api/tests

  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run Playwright E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
