name: Frontend Checks (i18n & Syntax)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  i18n-and-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check JavaScript syntax
        run: npm run check:syntax

      - name: Run i18n and translation regression tests
        run: npm test
